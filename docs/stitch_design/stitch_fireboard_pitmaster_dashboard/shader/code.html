<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_22 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_22" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_22');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    
    // Define the "meat" boundaries (rounded slab shape)
    float meatMask = smoothstep(0.45, 0.44, abs(uv.x - 0.5)) * smoothstep(0.35, 0.34, abs(uv.y - 0.5));
    
    // Core of the meat
    float core = 1.0 - length((uv - 0.5) * vec2(1.2, 1.8));
    core = smoothstep(0.0, 0.6, core);
    
    // Edge of the meat
    float edge = 1.0 - meatMask;
    
    // Animation factor: Resting progress (0.0 to 1.0 over time)
    // We'll loop this for the visualization
    float progress = mod(u_time * 0.2, 1.0);
    
    // Colors based on Ember & Char palette
    vec3 charcoal = vec3(0.05, 0.05, 0.06); // Surface color
    vec3 hotOrange = vec3(1.0, 0.3, 0.0);  // Primary color
    vec3 restingPink = vec3(0.8, 0.2, 0.2); // Warm meat pink
    
    // Gradient logic:
    // At start (progress 0): Hot orange outside, cooler core.
    // At end (progress 1): Uniform warmth.
    
    float outerHeat = smoothstep(0.3, 0.5, 1.0 - length(uv - 0.5));
    float heatWave = (1.0 - outerHeat) * (1.0 - progress);
    
    // Core warming up
    float coreHeat = core * (0.5 + 0.5 * progress);
    
    vec3 finalColor = mix(restingPink * 0.4, hotOrange, heatWave);
    finalColor = mix(finalColor, restingPink, coreHeat);
    
    // Apply meat mask
    finalColor *= meatMask;
    
    // Add a subtle "glow" to the hot parts
    float glow = exp(-5.0 * (1.0 - heatWave)) * (1.0 - progress);
    finalColor += hotOrange * glow * 0.3 * meatMask;
    
    // Background
    vec3 background = charcoal;
    
    gl_FragColor = vec4(mix(background, finalColor, meatMask), 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_22 -->
</body>
</html>
